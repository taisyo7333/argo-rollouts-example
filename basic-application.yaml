---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-demo
  namespace: openshift-gitops
spec:
  destination:
    namespace: rollouts-demo
    server: https://kubernetes.default.svc
  source:
    path: manifests/overlays/demo
    repoURL: https://github.com/taisyo7333/argo-rollouts-example
    targetRevision: HEAD
  sources: []
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
