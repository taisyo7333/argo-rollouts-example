---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rollouts-demo
  annotations:
    haproxy.router.openshift.io/disable_cookies: "true"
    haproxy.router.openshift.io/balance: roundrobin
spec:
  port:
    targetPort: http
  tls:
    termination: edge
  to:
    kind: Service
    name: rollouts-demo-stable
    weight: 100
  alternateBackends:
  - kind: Service
    name: rollouts-demo-canary
    weight: 0
