---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollout-manager
  namespace: openshift-gitops
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  source:
    path: manifests/rollout-manager
    repoURL: https://github.com/taisyo7333/argo-rollouts-example
    targetRevision: analysis
  sources: []
  project: default
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
